<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목 — AI와 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E3E7DF;
    --surface: #EEF1EA;
    --ink: #1F2B26;
    --muted: #5B6862;
    --rule: #C6CEC6;
    --accent: #2D6A59;
    --accent-ink: #F3F7F4;
    --wood-a: #E2BC78;
    --wood-b: #CFA05A;
    --line: #4A3517;
    --win: #A3212A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17201C; --surface: #1F2A25; --ink: #E5EBE6; --muted: #98A69F;
      --rule: #34423B; --accent: #6DB49E; --accent-ink: #10201A;
      --wood-a: #D2AA66; --wood-b: #B98A47; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17201C; --surface: #1F2A25; --ink: #E5EBE6; --muted: #98A69F;
    --rule: #34423B; --accent: #6DB49E; --accent-ink: #10201A;
    --wood-a: #D2AA66; --wood-b: #B98A47; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  .wrap {
    max-width: 1000px; margin: 0 auto; padding: 28px 20px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 36px; align-items: start;
  }
  .board-wrap {
    position: relative; width: 100%; max-width: 640px; justify-self: end;
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 18px 40px -18px rgba(40,25,5,.55), 0 4px 10px -4px rgba(40,25,5,.35);
  }
  svg#board { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: manipulation; cursor: pointer; outline: none; }
  svg#board:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  svg#board.locked { cursor: default; }

  aside { display: flex; flex-direction: column; gap: 26px; padding-top: 6px; }
  h1 {
    font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-weight: 700;
    font-size: 64px; line-height: 1; letter-spacing: -0.02em; margin: 0;
  }
  .sub { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

  .score {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 14px 0;
  }
  .score div { display: flex; flex-direction: column; }
  .score div:last-child { align-items: flex-end; }
  .score b { font-family: "Gowun Batang", serif; font-size: 44px; line-height: 1; font-weight: 700; }
  .score span { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .score i { font-style: normal; color: var(--muted); font-family: "Gowun Batang", serif; font-size: 28px; padding-bottom: 14px; }

  .pts { display: flex; justify-content: space-between; align-items: baseline; margin-top: -12px; }
  .pts span { font-size: 14px; color: var(--muted); }
  .pts b { font-family: "Gowun Batang", serif; font-size: 26px; font-weight: 700; color: var(--accent); }
  .status { min-height: 52px; font-size: 16px; font-weight: 500; display: flex; gap: 10px; align-items: flex-start; }
  .status .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; margin-top: 5px; }
  .dot.black { background: radial-gradient(circle at 35% 30%, #6a6a6a, #1a1a1a 70%); }
  .dot.white { background: radial-gradient(circle at 35% 30%, #fff, #cfcfc6 80%); box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
  .status small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
  .thinking .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: 14px; color: var(--muted); margin-bottom: 8px; padding: 0; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--surface); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { white-space: nowrap; letter-spacing: -0.01em; text-align: center; padding: 7px 2px; border-radius: 999px; font-size: 14px; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
  .seg input:checked + label { background: var(--ink); color: var(--bg); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls { display: flex; flex-direction: column; gap: 18px; }

  .actions { display: flex; gap: 10px; }
  button {
    font: inherit; font-size: 15px; font-weight: 500; flex: 1; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rules { font-size: 14px; color: var(--muted); margin: 0; }
  .rules kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }

  .stone-new { transform-box: fill-box; transform-origin: center; animation: drop .22s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes drop { from { transform: scale(1.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .winline { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw .6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .stone-new, .winline, .thinking .dot { animation: none; stroke-dashoffset: 0; }
  }

  .result {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: color-mix(in srgb, var(--bg) 45%, transparent); border-radius: 6px;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .result[hidden] { display: none; }
  .result-card {
    width: min(340px, 100%); background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 14px; padding: 24px 22px 20px;
    box-shadow: 0 24px 50px -20px rgba(20, 30, 25, .55);
  }
  .r-title { font-family: "Gowun Batang", serif; font-size: 30px; font-weight: 700; line-height: 1.2; margin: 0; }
  .r-sub { margin: 6px 0 18px; color: var(--muted); font-size: 14px; }
  .r-stats { display: grid; grid-template-columns: 1fr 1fr; margin: 0 0 20px; border-top: 1px solid var(--rule); }
  .r-stats div { padding-top: 12px; }
  .r-stats div + div { border-left: 1px solid var(--rule); padding-left: 16px; }
  .r-stats dt { font-size: 13px; color: var(--muted); }
  .r-stats dd { margin: 2px 0 0; font-family: "Gowun Batang", serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .r-stats dd small { font-family: "IBM Plex Sans KR", sans-serif; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }

  .rank-box h2 { font-family: "Gowun Batang", serif; font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-list li {
    display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 15px;
  }
  .rank-list .no { font-family: "Gowun Batang", serif; font-weight: 700; color: var(--muted); }
  .rank-list li:nth-child(-n+3) .no { color: var(--ink); }
  .rank-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-list .sc { font-variant-numeric: tabular-nums; }
  .rank-list li.me { color: var(--accent); font-weight: 600; }
  .rank-list li.me .no { color: var(--accent); }
  .rank-list li.gap { border-bottom: 0; padding: 0; height: 10px; }
  .nick { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
  .nick input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px;
  }
  .nick input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rank-note { margin: 0; font-size: 14px; color: var(--muted); }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 22px; padding: 18px 12px 32px; }
    .board-wrap { justify-self: center; order: 2; }
    aside { order: 1; display: contents; }
    .head { order: 0; }
    .score { order: 1; }
    .status { order: 1; }
    .pts { order: 1; margin-top: -8px; }
    .board-wrap { order: 3; }
    .controls { order: 4; }
    .rules { order: 6; }
    .rank-box { order: 5; }
    h1 { font-size: 46px; }
    .head-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="board-wrap">
    <svg id="board" viewBox="0 0 620 620" role="grid" aria-label="오목판 15줄. 방향키로 이동하고 Enter로 돌을 놓아요." tabindex="0">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--wood-a)"/>
          <stop offset="1" stop-color="var(--wood-b)"/>
        </linearGradient>
        <radialGradient id="g-black" cx="35%" cy="30%" r="70%">
          <stop offset="0" stop-color="#6b6b6b"/>
          <stop offset=".55" stop-color="#232323"/>
          <stop offset="1" stop-color="#050505"/>
        </radialGradient>
        <radialGradient id="g-white" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".7" stop-color="#e9e9e2"/>
          <stop offset="1" stop-color="#bdbdb3"/>
        </radialGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.6" flood-color="#2a1a05" flood-opacity=".45"/>
        </filter>
      </defs>
      <rect width="620" height="620" fill="url(#wood)"/>
      <g id="grain"></g>
      <g id="grid"></g>
      <g id="stones"></g>
      <g id="overlay"></g>
    </svg>
    <div class="result" id="result" hidden>
      <div class="result-card" role="dialog" aria-labelledby="r-title">
        <p id="r-title" class="r-title"></p>
        <p id="r-sub" class="r-sub"></p>
        <dl class="r-stats">
          <div><dt>누적 점수</dt><dd id="r-pts"></dd></div>
          <div><dt>내 순위</dt><dd id="r-rank"></dd></div>
        </dl>
        <div class="actions">
          <button id="r-board" type="button">판 보기</button>
          <button id="r-new" type="button" class="primary">한 판 더</button>
        </div>
      </div>
    </div>
  </div>

  <aside>
    <div class="head">
      <h1>오목</h1>
      <p class="sub">AI와 마주 앉아 다섯 줄을 먼저 이으세요.</p>
    </div>

    <div class="score" aria-label="전적">
      <div><b id="sc-me">0</b><span>나</span></div>
      <i>:</i>
      <div><b id="sc-ai">0</b><span>AI</span></div>
    </div>

    <div class="pts"><span>누적 점수</span><b id="pts">0점</b></div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="controls">
      <fieldset>
        <legend>내 돌</legend>
        <div class="seg">
          <input type="radio" name="color" id="c-black" value="1" checked><label for="c-black">흑 · 먼저 둠</label>
          <input type="radio" name="color" id="c-white" value="2"><label for="c-white">백 · 나중에 둠</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>AI 실력</legend>
        <div class="seg">
          <input type="radio" name="lvl" id="l-1" value="1"><label for="l-1">쉬움</label>
          <input type="radio" name="lvl" id="l-2" value="2" checked><label for="l-2">보통</label>
          <input type="radio" name="lvl" id="l-3" value="3"><label for="l-3">어려움</label>
          <input type="radio" name="lvl" id="l-4" value="4"><label for="l-4">매우 어려움</label>
        </div>
      </fieldset>
      <div class="actions">
        <button id="undo" type="button">무르기</button>
        <button id="new" type="button" class="primary">새 게임</button>
      </div>
    </div>

    <section class="rank-box" aria-label="랭킹">
      <h2>랭킹</h2>
      <label class="nick"><span>내 닉네임</span><input id="nick" maxlength="12" autocomplete="nickname"></label>
      <div id="rank"><p class="rank-note">랭킹을 불러오는 중…</p></div>
    </section>

    <p class="rules">가로, 세로, 대각선 어느 방향이든 돌 다섯 개를 먼저 한 줄로 놓으면 이겨요. 빨리 이길수록 점수가 커요. 다섯 수 만에 이기면 최대 점수를 받고, 최대 점수는 쉬움 50, 보통 300, 어려움 2,000, 매우 어려움 5,000점이에요. 키보드로는 <kbd>방향키</kbd>로 움직이고 <kbd>Enter</kbd>로 둬요.</p>
  </aside>
</main>

<script>
(() => {
  const N = 15, M = 30, C = 40, SIZE = 620;
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const svg = $("board");

  // ---------- 판 그리기 ----------
  (function drawStatic() {
    const grain = $("grain");
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let k = 0; k < 46; k++) {
      const y = rnd() * SIZE, a = (rnd() - 0.5) * 18, b = (rnd() - 0.5) * 18;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", `M0 ${y} C ${SIZE*0.33} ${y + a}, ${SIZE*0.66} ${y + b}, ${SIZE} ${y + (a - b) / 3}`);
      p.setAttribute("stroke", "#6b4515");
      p.setAttribute("stroke-opacity", (0.04 + rnd() * 0.07).toFixed(3));
      p.setAttribute("stroke-width", (0.6 + rnd() * 1.8).toFixed(2));
      p.setAttribute("fill", "none");
      grain.appendChild(p);
    }
    const grid = $("grid");
    let d = "";
    for (let i = 0; i < N; i++) {
      const v = M + i * C;
      d += `M${M} ${v}H${M + (N - 1) * C}M${v} ${M}V${M + (N - 1) * C}`;
    }
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", "var(--line)");
    path.setAttribute("stroke-width", "1.1");
    path.setAttribute("stroke-opacity", ".85");
    grid.appendChild(path);
    const border = document.createElementNS(NS, "rect");
    Object.entries({ x: M, y: M, width: (N - 1) * C, height: (N - 1) * C, fill: "none", stroke: "var(--line)", "stroke-width": 2 })
      .forEach(([k, v]) => border.setAttribute(k, v));
    grid.appendChild(border);
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x, y]) => {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", M + x * C); c.setAttribute("cy", M + y * C); c.setAttribute("r", 4);
      c.setAttribute("fill", "var(--line)");
      grid.appendChild(c);
    });
  })();

  // ---------- 엔진 ----------
  const board = new Int8Array(N * N);
  const stack = [];
  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];
  const wins = [], cellWins = Array.from({ length: N * N }, () => []);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) for (const [dx, dy] of DIRS) {
    const ex = x + 4 * dx, ey = y + 4 * dy;
    if (ex < 0 || ex >= N || ey < 0 || ey >= N) continue;
    const cells = [];
    for (let k = 0; k < 5; k++) cells.push((y + k * dy) * N + (x + k * dx));
    const id = wins.length;
    wins.push(cells);
    cells.forEach((c) => cellWins[c].push(id));
  }
  const W = wins.length;
  const bc = new Int8Array(W), wc = new Int8Array(W);
  const WS = [0, 1, 15, 260, 6000, 1000000];
  let evalScore = 0;
  const sgn = (p) => (p === 1 ? 1 : -1);
  const contrib = (b, w) => (w === 0 ? WS[b] : 0) - (b === 0 ? WS[w] : 0);

  function moveDelta(i, p) {
    let d = 0;
    for (const id of cellWins[i]) {
      const b = bc[id], w = wc[id];
      d += (p === 1 ? contrib(b + 1, w) : contrib(b, w + 1)) - contrib(b, w);
    }
    return d;
  }
  function place(i, p) {
    evalScore += moveDelta(i, p);
    board[i] = p; stack.push(i);
    let won = -1;
    const arr = p === 1 ? bc : wc;
    for (const id of cellWins[i]) if (++arr[id] === 5) won = id;
    return won;
  }
  function unplace() {
    const i = stack.pop(), p = board[i];
    board[i] = 0;
    const arr = p === 1 ? bc : wc;
    for (const id of cellWins[i]) arr[id]--;
    evalScore -= moveDelta(i, p);
    return i;
  }
  function canWin(i, p) {
    for (const id of cellWins[i]) {
      if (p === 1 ? (bc[id] === 4 && wc[id] === 0) : (wc[id] === 4 && bc[id] === 0)) return true;
    }
    return false;
  }
  function hasFour(p) {
    for (let id = 0; id < W; id++) {
      if (p === 1 ? (bc[id] === 4 && wc[id] === 0) : (wc[id] === 4 && bc[id] === 0)) return true;
    }
    return false;
  }
  const mark = new Int32Array(N * N); let stamp = 0;
  function candidates() {
    stamp++;
    const out = [];
    for (const m of stack) {
      const x = m % N, y = (m / N) | 0;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const j = ny * N + nx;
        if (board[j] === 0 && mark[j] !== stamp) { mark[j] = stamp; out.push(j); }
      }
    }
    return out;
  }
  function ordered(p) {
    const s = sgn(p);
    return candidates().map((i) => ({ i, v: s * moveDelta(i, p) })).sort((a, b) => b.v - a.v);
  }
  const WIN = 1e9;
  function negamax(depth, alpha, beta, p, K) {
    const list = ordered(p).slice(0, K);
    if (!list.length) return 0;
    let best = -Infinity;
    const s = sgn(p);
    for (const { i } of list) {
      let v;
      if (place(i, p) >= 0) v = WIN + depth;
      else if (depth === 1) v = hasFour(3 - p) ? -WIN : s * evalScore;
      else v = -negamax(depth - 1, -beta, -alpha, 3 - p, K);
      unplace();
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  // 공격 점수(내 줄을 키움)와 수비 점수(상대 줄을 끊음)를 따로 계산
  function sideScores(i, p) {
    let atk = 0, def = 0;
    for (const id of cellWins[i]) {
      const own = p === 1 ? bc[id] : wc[id], opp = p === 1 ? wc[id] : bc[id];
      if (opp === 0) atk += WS[own + 1] - WS[own];
      if (own === 0) def += WS[opp];
    }
    return [atk, def];
  }
  // win: 이길 수 있는 자리를 알아챌 확률, block: 상대 4를 막을 확률
  // defW: 수비를 얼마나 신경 쓰는지, top/noise: 최선이 아닌 수를 고르는 정도
  const LEVELS = {
    1: { win: 0.6,  block: 0.3,  defW: 0.2,  top: 8, noise: 0.85 }, // 초등학생도 이길 수 있게
    2: { win: 0.9,  block: 0.75, defW: 0.55, top: 4, noise: 0.45 }, // 중학생이 이길 수 있게
    3: { win: 1,    block: 1,    defW: 0.9,  top: 2, noise: 0.12 }, // 성인이 이길 수 있게
    4: { win: 1,    block: 1,    depth: 4, rootK: 14, K: 10 },      // 수 읽기를 하는 실력자용
  };
  function chooseMove(p, level) {
    const L = LEVELS[level];
    if (!stack.length) {
      if (level <= 2) return (6 + Math.floor(Math.random() * 3)) * N + 6 + Math.floor(Math.random() * 3);
      return 7 * N + 7;
    }
    const list = ordered(p);
    if (Math.random() < L.win) for (const { i } of list) if (canWin(i, p)) return i;
    if (Math.random() < L.block) for (const { i } of list) if (canWin(i, 3 - p)) return i;

    if (!L.depth) {
      const scored = list.map(({ i }) => {
        const [a, d] = sideScores(i, p);
        return { i, v: a + L.defW * d };
      }).sort((x, y) => y.v - x.v);
      if (Math.random() < L.noise) {
        const top = scored.slice(0, L.top);
        return top[Math.floor(Math.random() * top.length)].i;
      }
      return scored[0].i;
    }
    const depth = L.depth, rootK = L.rootK, K = L.K;
    const s = sgn(p);
    let best = -Infinity, bestI = list[0].i;
    for (const { i } of list.slice(0, rootK)) {
      let v;
      if (place(i, p) >= 0) v = WIN;
      else if (depth === 1) v = s * evalScore;
      else v = -negamax(depth - 1, -Infinity, Infinity, 3 - p, K);
      unplace();
      v += Math.random() * 3;
      if (v > best) { best = v; bestI = i; }
    }
    return bestI;
  }

  // ---------- 게임 상태 ----------
  let human = 1, level = 2, turn = 1, over = false, thinking = false, winLine = null, gen = 0;
  let undoUsed = false; // 무르기는 내 차례 한 번에 한 번만
  // 점수: 다섯 수 만에 이기면 최대 점수, 더 오래 걸릴수록 최대 × 5 / 내가 둔 수
  const MAX_PTS = { 1: 50, 2: 300, 3: 2000, 4: 5000 };
  const LV_NAME = { 1: "쉬움", 2: "보통", 3: "어려움", 4: "매우 어려움" };
  let myMoves = 0, lastAward = 0; // myMoves는 무른 수도 포함해서 셈
  let cursor = 7 * N + 7, hover = -1, keyMode = false;
  let score = { me: 0, ai: 0, pts: 0 };
  try { const s = JSON.parse(localStorage.getItem("omok-score")); if (s && typeof s.me === "number") { score = s; if (typeof score.pts !== "number") score.pts = 0; } } catch (e) {}
  const saveScore = () => { try { localStorage.setItem("omok-score", JSON.stringify(score)); } catch (e) {} syncScore(); };

  const pos = (i) => [M + (i % N) * C, M + ((i / N) | 0) * C];

  function render(newest = -1) {
    const g = $("stones");
    g.innerHTML = "";
    for (const i of stack) {
      const [cx, cy] = pos(i);
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", 18);
      c.setAttribute("fill", board[i] === 1 ? "url(#g-black)" : "url(#g-white)");
      c.setAttribute("filter", "url(#shadow)");
      if (i === newest) c.classList.add("stone-new");
      g.appendChild(c);
    }
    const o = $("overlay");
    o.innerHTML = "";
    const last = stack[stack.length - 1];
    if (last !== undefined && !winLine) {
      const [cx, cy] = pos(last);
      const m = document.createElementNS(NS, "circle");
      m.setAttribute("cx", cx); m.setAttribute("cy", cy); m.setAttribute("r", 4.5);
      m.setAttribute("fill", board[last] === 1 ? "#f2f2ea" : "#1c1c1c");
      o.appendChild(m);
    }
    const yourTurn = !over && !thinking && turn === human;
    const ghostAt = keyMode ? cursor : hover;
    if (yourTurn && ghostAt >= 0 && board[ghostAt] === 0) {
      const [cx, cy] = pos(ghostAt);
      const gh = document.createElementNS(NS, "circle");
      gh.setAttribute("cx", cx); gh.setAttribute("cy", cy); gh.setAttribute("r", 18);
      gh.setAttribute("fill", human === 1 ? "url(#g-black)" : "url(#g-white)");
      gh.setAttribute("opacity", ".4");
      gh.setAttribute("pointer-events", "none");
      o.appendChild(gh);
    }
    if (keyMode && document.activeElement === svg) {
      const [cx, cy] = pos(cursor);
      const r = document.createElementNS(NS, "rect");
      Object.entries({ x: cx - 20, y: cy - 20, width: 40, height: 40, rx: 6, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5 })
        .forEach(([k, v]) => r.setAttribute(k, v));
      o.appendChild(r);
    }
    if (winLine) {
      const [x1, y1] = pos(winLine[0]), [x2, y2] = pos(winLine[4]);
      const l = document.createElementNS(NS, "line");
      Object.entries({ x1, y1, x2, y2, stroke: "var(--win)", "stroke-width": 6, "stroke-linecap": "round", "stroke-opacity": ".9" })
        .forEach(([k, v]) => l.setAttribute(k, v));
      l.classList.add("winline");
      o.appendChild(l);
    }
    svg.classList.toggle("locked", !yourTurn);
    renderStatus();
    $("sc-me").textContent = score.me;
    $("sc-ai").textContent = score.ai;
    $("pts").textContent = score.pts.toLocaleString("ko-KR") + "점";
    $("undo").disabled = thinking || undoUsed || !stack.some((i) => board[i] === human);
    $("undo").textContent = undoUsed ? "무르기 사용함" : "무르기";
  }

  function renderStatus() {
    const st = $("status");
    const color = turn === 1 ? "black" : "white";
    const moves = `${stack.length}수째`;
    let main, sub = "";
    st.classList.toggle("thinking", thinking);
    if (over === "me") {
      main = `이겼어요! +${lastAward.toLocaleString("ko-KR")}점`;
      sub = `${myMoves}수 만에 완성했어요. ${LV_NAME[level]} 최대 ${MAX_PTS[level].toLocaleString("ko-KR")}점`;
    }
    else if (over === "ai") { main = "AI가 이겼어요."; sub = "무르기로 되돌리거나 새 게임을 시작하세요."; }
    else if (over === "draw") { main = "판이 가득 찼어요. 무승부예요."; }
    else if (thinking) { main = "AI가 수를 고르는 중…"; sub = moves; }
    else { main = `당신 차례예요. ${human === 1 ? "흑돌" : "백돌"}을 놓으세요.`; sub = moves; }
    const dotColor = over ? (over === "me" ? (human === 1 ? "black" : "white") : over === "ai" ? (human === 1 ? "white" : "black") : color) : color;
    st.innerHTML = `<span class="dot ${dotColor}"></span><span>${main}${sub ? `<small>${sub}</small>` : ""}</span>`;
  }

  function doMove(i, p) {
    const w = place(i, p);
    if (w >= 0) {
      winLine = wins[w];
      over = p === human ? "me" : "ai";
      score[over]++;
      if (over === "me") {
        lastAward = Math.max(1, Math.round(MAX_PTS[level] * Math.min(1, 5 / myMoves)));
        score.pts += lastAward;
      }
      saveScore();
    } else if (stack.length === N * N) {
      over = "draw";
    }
    turn = 3 - p;
    render(i);
    if (over) setTimeout(showResult, 650, gen);
  }

  function aiTurn() {
    if (over || turn === human) return;
    thinking = true; render();
    const my = gen;
    setTimeout(() => {
      if (my !== gen) return;
      const i = chooseMove(3 - human, level);
      thinking = false;
      doMove(i, 3 - human);
    }, 280);
  }

  function humanPlay(i) {
    if (over || thinking || turn !== human || i < 0 || board[i] !== 0) return;
    undoUsed = false;
    myMoves++;
    doMove(i, human);
    aiTurn();
  }

  function newGame() {
    gen++;
    while (stack.length) unplace();
    over = false; thinking = false; winLine = null; turn = 1; hover = -1; undoUsed = false; myMoves = 0; lastAward = 0;
    hideResult();
    render();
    aiTurn();
  }

  function undo() {
    if (thinking || undoUsed) return;
    if (!stack.some((i) => board[i] === human)) return;
    undoUsed = true;
    if (over === "me") { // 이긴 뒤 무르면 받은 점수와 승리를 돌려놓음
      score.me--; score.pts -= lastAward; lastAward = 0; saveScore();
    }
    gen++;
    // 흑이 항상 먼저 두므로, 뺀 돌의 순번으로 색을 알 수 있다. 내 돌을 뺄 때까지 되돌린다.
    while (stack.length) {
      unplace();
      const removedColor = stack.length % 2 === 0 ? 1 : 2;
      if (removedColor === human) break;
    }
    over = false; winLine = null; turn = human; thinking = false;
    hideResult();
    render();
  }

  // ---------- 입력 ----------
  function cellFromEvent(e) {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * SIZE, y = ((e.clientY - r.top) / r.height) * SIZE;
    const cx = Math.round((x - M) / C), cy = Math.round((y - M) / C);
    if (cx < 0 || cy < 0 || cx >= N || cy >= N) return -1;
    if (Math.hypot(x - (M + cx * C), y - (M + cy * C)) > C * 0.55) return -1;
    return cy * N + cx;
  }
  svg.addEventListener("click", (e) => { keyMode = false; humanPlay(cellFromEvent(e)); });
  svg.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    keyMode = false;
    const i = cellFromEvent(e);
    if (i !== hover) { hover = i; render(); }
  });
  svg.addEventListener("pointerleave", () => { hover = -1; render(); });
  svg.addEventListener("keydown", (e) => {
    const x = cursor % N, y = (cursor / N) | 0;
    const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (moves[e.key]) {
      e.preventDefault(); keyMode = true;
      const [dx, dy] = moves[e.key];
      cursor = Math.min(N - 1, Math.max(0, y + dy)) * N + Math.min(N - 1, Math.max(0, x + dx));
      render();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault(); keyMode = true; humanPlay(cursor);
    }
  });
  svg.addEventListener("focus", () => render());
  svg.addEventListener("blur", () => render());

  $("new").addEventListener("click", newGame);
  $("undo").addEventListener("click", undo);
  document.querySelectorAll('input[name="color"]').forEach((r) => r.addEventListener("change", (e) => {
    human = +e.target.value; newGame();
  }));
  document.querySelectorAll('input[name="lvl"]').forEach((r) => r.addEventListener("change", (e) => {
    level = +e.target.value; newGame();
  }));

  // ---------- 결과 창 ----------
  const nf = (n) => n.toLocaleString("ko-KR");
  function rankOf(id) {
    const me = rankDocs.find((d) => d.id === id);
    if (!me) return null;
    return 1 + rankDocs.filter((d) => d.pts > me.pts).length;
  }
  function fillResultRank() {
    const el = $("r-rank");
    if (!ONLINE) { el.innerHTML = `-<small>온라인 랭킹 꺼짐</small>`; return; }
    if (!rankReady) { el.textContent = "…"; return; }
    const r = rankOf(myId);
    el.innerHTML = r ? `${r}등<small>${rankDocs.length}명 중</small>` : `-<small>기록 없음</small>`;
  }
  function showResult(g) {
    if (g !== gen || !over) return;
    if (over === "me") {
      $("r-title").textContent = `이겼어요! +${nf(lastAward)}점`;
      $("r-sub").textContent = `${myMoves}수 만에 완성했어요. ${LV_NAME[level]} 최대 ${nf(MAX_PTS[level])}점`;
    } else if (over === "ai") {
      $("r-title").textContent = "AI가 이겼어요";
      $("r-sub").textContent = "이번 판은 점수가 없어요.";
    } else {
      $("r-title").textContent = "무승부예요";
      $("r-sub").textContent = "판이 가득 찼어요.";
    }
    $("r-pts").textContent = nf(score.pts) + "점";
    fillResultRank();
    $("result").hidden = false;
    $("r-new").focus();
  }
  function hideResult() { $("result").hidden = true; }
  $("r-new").addEventListener("click", newGame);
  $("r-board").addEventListener("click", () => { hideResult(); svg.focus(); });
  $("result").addEventListener("keydown", (e) => { if (e.key === "Escape") hideResult(); });

  // ---------- 온라인 랭킹 (Supabase) ----------
  // 아래 두 값을 채우면 온라인 랭킹이 켜져요. 비워 두면 게임만 동작해요.
  const SUPABASE_URL = "https://hdkybudcuzvrzqcjafqq.supabase.co";      // 예: https://abcdefgh.supabase.co
  const SUPABASE_ANON_KEY = "sb_publishable_W1DpMNcshBcAmbLDKJrEdA_gWbd6igG"; // Supabase > Project Settings > API 의 anon public 키
  const ONLINE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  const HDR = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  // 예전 방식 anon 키(eyJ…)만 Authorization 헤더에 같이 넣고, 새 publishable 키는 apikey 헤더만 쓴다
  if (SUPABASE_ANON_KEY.startsWith("eyJ")) HDR.Authorization = "Bearer " + SUPABASE_ANON_KEY;

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
      (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));
  let player = null;
  try { player = JSON.parse(localStorage.getItem("omok-player")); } catch (e) {}
  if (!player || !player.id || !player.secret) {
    player = { id: uuid(), secret: uuid() + uuid(), name: "손님" + Math.floor(1000 + Math.random() * 9000) };
    try { localStorage.setItem("omok-player", JSON.stringify(player)); } catch (e) {}
  }
  const myId = player.id;
  let rankDocs = [], rankReady = false, syncing = Promise.resolve();

  function syncScore() {
    if (!ONLINE) return syncing;
    const body = { p_id: myId, p_secret: player.secret, p_name: player.name, p_pts: score.pts, p_wins: score.me, p_losses: score.ai };
    syncing = syncing
      .then(() => fetch(SUPABASE_URL + "/rest/v1/rpc/submit_score", { method: "POST", headers: HDR, body: JSON.stringify(body) }))
      .then(() => loadRank())
      .catch(() => {});
    return syncing;
  }
  async function loadRank() {
    if (!ONLINE) return;
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/ranking?select=id,name,pts&order=pts.desc&limit=1000", { headers: HDR });
      if (!r.ok) throw new Error(r.status);
      rankDocs = (await r.json()).map((x) => ({ id: x.id, name: x.name, pts: +x.pts || 0 }));
      rankReady = true;
    } catch (e) {}
    renderRank();
  }
  function renderRank() {
    const box = $("rank");
    if (!$("result").hidden) fillResultRank();
    if (!ONLINE) { box.innerHTML = `<p class="rank-note">온라인 랭킹이 아직 연결되지 않았어요. 점수는 이 기기에만 저장돼요.</p>`; return; }
    if (!rankReady) { box.innerHTML = `<p class="rank-note">랭킹을 불러오는 중…</p>`; return; }
    if (!rankDocs.length) { box.innerHTML = `<p class="rank-note">아직 기록이 없어요. 한 판 이기면 1등이에요.</p>`; return; }
    const top = rankDocs.slice(0, 10);
    const myDoc = rankDocs.find((d) => d.id === myId);
    const ol = document.createElement("ol");
    ol.className = "rank-list";
    const row = (d) => {
      const li = document.createElement("li");
      if (d.id === myId) li.className = "me";
      const no = document.createElement("span"); no.className = "no"; no.textContent = rankOf(d.id);
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = (d.name || "이름 없는 기사") + (d.id === myId ? " (나)" : "");
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = nf(d.pts) + "점";
      li.append(no, nm, sc);
      return li;
    };
    top.forEach((d) => ol.appendChild(row(d)));
    if (myDoc && !top.includes(myDoc)) {
      const gap = document.createElement("li"); gap.className = "gap"; gap.setAttribute("aria-hidden", "true");
      ol.append(gap, row(myDoc));
    }
    box.replaceChildren(ol);
  }

  const nick = $("nick");
  nick.value = player.name;
  nick.addEventListener("change", () => {
    const v = nick.value.trim().slice(0, 12);
    if (!v) { nick.value = player.name; return; }
    player.name = v;
    try { localStorage.setItem("omok-player", JSON.stringify(player)); } catch (e) {}
    if (score.pts > 0 || score.me > 0 || score.ai > 0) syncScore();
  });

  render();
  renderRank();
  if (ONLINE) {
    if (score.pts > 0 || score.me > 0 || score.ai > 0) syncScore(); else loadRank();
    setInterval(() => { if (!document.hidden) loadRank(); }, 30000);
  }
})();
</script>
</body>
